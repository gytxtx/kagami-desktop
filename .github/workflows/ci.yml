name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore tests/Kagami.Tests/Kagami.Tests.csproj -r win-x64

      - name: Build
        run: dotnet build src/Kagami/Kagami.csproj -c Release -r win-x64 --no-restore

      - name: Test
        run: >-
          dotnet test tests/Kagami.Tests/Kagami.Tests.csproj
          -c Release
          -r win-x64
          --no-restore
          --logger "trx;LogFileName=kagami-tests.trx"
          --results-directory artifacts/test-results

      - name: Publish win-x64
        run: >-
          dotnet publish src/Kagami/Kagami.csproj
          -c Release
          -r win-x64
          --no-restore
          -o artifacts/kagami-win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: kagami-win-x64-${{ github.sha }}
          path: artifacts/kagami-win-x64
          if-no-files-found: error
          retention-days: 14
